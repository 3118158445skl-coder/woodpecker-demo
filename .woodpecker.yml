steps:
  test:
    image: alpine:latest
    commands:
      - echo "=============================="
      - echo "Woodpecker CI 构建测试"
      - echo "=============================="
      - pwd
      - ls -la

  docker-build:
    image: docker:cli

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      TCR_USERNAME:
        from_secret: TCR_USERNAME
      TCR_PASSWORD:
        from_secret: TCR_PASSWORD

    commands:
      - echo "开始登录腾讯云 TCR..."
      - echo "$TCR_PASSWORD" | docker login images-skl.tencentcloudcr.com -u "$TCR_USERNAME" --password-stdin

      - echo "TCR 登录成功"

      - echo "开始构建镜像..."
      - docker build -t images-skl.tencentcloudcr.com/k8s-ms/goods-service:latest .

      - echo "开始推送镜像..."
      - docker push images-skl.tencentcloudcr.com/k8s-ms/goods-service:latest

      - echo "=============================="
      - echo "镜像构建并推送成功！"
      - echo "=============================="
