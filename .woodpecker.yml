steps:
  test:
    image: alpine:latest
    commands:
      - echo "=============================="
      - echo "Woodpecker CI 构建测试"
      - echo "=============================="
      - pwd
      - ls -la

  docker-build:
    image: docker:cli

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      ACR_USERNAME:
        from_secret: ACR_USERNAME
      ACR_PASSWORD:
        from_secret: ACR_PASSWORD

    commands:
      - echo "=============================="
      - echo "登录阿里云 ACR..."
      - echo "=============================="

      - echo "$ACR_PASSWORD" | docker login crpi-yhp951ow9ijc89zi.cn-shanghai.personal.cr.aliyuncs.com -u "$ACR_USERNAME" --password-stdin

      - echo "ACR 登录成功"

      - echo "=============================="
      - echo "开始构建镜像..."
      - echo "=============================="

      - docker build -t crpi-yhp951ow9ijc89zi.cn-shanghai.personal.cr.aliyuncs.com/harbor_songkangle/yzf:test .

      - echo "=============================="
      - echo "开始推送镜像..."
      - echo "=============================="

      - docker push crpi-yhp951ow9ijc89zi.cn-shanghai.personal.cr.aliyuncs.com/harbor_songkangle/yzf:test

      - echo "=============================="
      - echo "镜像构建并推送成功！"
      - echo "=============================="
