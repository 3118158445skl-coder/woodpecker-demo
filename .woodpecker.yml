steps:
  test:
    image: alpine:latest
    commands:
      - echo "=============================="
      - echo "Woodpecker CI 构建测试"
      - echo "=============================="
      - pwd
      - ls -la

  docker-build:
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - echo "开始 Docker 构建..."
      - docker version
      - docker build -t woodpecker-demo:test .
      - echo "Docker 构建成功！"
